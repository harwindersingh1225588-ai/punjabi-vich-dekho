<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Croatian Punjabi Dictionary</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .word-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #0055A5; }
        .croatian { font-size: 1.2em; font-weight: bold; color: #333; }
        .punjabi { font-size: 1.1em; color: #0055A5; margin-top: 5px; }
        .pronunciation { font-size: 0.9em; color: #666; font-style: italic; margin-top: 3px; }
    </style>
</head>
<body>

    <h1>Croatia - Punjab Dictionary</h1>

    <div class="word-card">
        <div class="croatian">morski lav</div>
        <div class="pronunciation">ਮੋਰਸਕੀ ਲਾਵ</div>
        <div class="punjabi">ਅਰਥ: ਸੀ ਲਾਇન (ਸਮੁੰਦਰੀ ਸ਼ੇਰ)</div>
    </div>

    <div class="word-card">
        <div class="croatian">džezva</div>
        <div class="pronunciation">ਜੇਜ਼ਵਾ</div>
        <div class="punjabi">ਅਰਥ: ਕੌਫੀ ਪੋਟ (ਕੌਫੀ ਬਣਾਉਣ ਵਾਲਾ ਬਰਤन)</div>
    </div>

    <div class="word-card">
        <div class="croatian">avion</div>
        <div class="pronunciation">ਅਵੀਓਨ</div>
        <div class="punjabi">ਅਰਥ: ਹਵਾਈ ਜਹਾਜ਼</div>
    </div>

</body>
</html>
